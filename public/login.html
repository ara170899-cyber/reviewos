<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReviewOS — вход</title>
  <link rel="stylesheet" href="/app.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(circle at 18% 12%, rgba(41,151,255,.18), transparent 30%),
        radial-gradient(circle at 82% 84%, rgba(191,90,242,.13), transparent 34%),
        linear-gradient(135deg, #0a0c12, #11141d 52%, #0c0f17);
    }
    .login-shell {
      width: min(440px, 100%);
      display: flex; flex-direction: column; align-items: center;
    }
    .brand-mark {
      display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
      font-weight: 700; font-size: 18px; letter-spacing: -.3px; color: var(--t1);
    }
    .brand-mark .dot {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      box-shadow: 0 6px 22px rgba(41,151,255,.42);
    }
    .login-card {
      width: 100%;
      background: rgba(20,24,33,.78);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--line); border-radius: 18px;
      padding: 32px;
      box-shadow: 0 28px 80px rgba(0,0,0,.45);
    }
    .login-card h1 { margin: 0 0 6px; font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
    .login-card .sub { margin: 0 0 22px; color: var(--t2); font-size: 13.5px; }
    .login-card .rs-field { margin-bottom: 14px; }
    .login-card .rs-btn { width: 100%; padding: 13px; font-size: 14.5px; margin-top: 6px; }
    .err { min-height: 18px; margin-top: 10px; color: #ff6b62; font-size: 12.5px; line-height: 1.45; }
    .footer {
      margin-top: 22px; font-size: 11.5px; color: var(--t4);
      display: flex; gap: 14px;
    }
    .footer span::before { content: "·"; margin-right: 14px; color: var(--line-2); }
    .footer span:first-child::before { display: none; }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="brand-mark">
      <span class="dot"></span>
      <span>ReviewOS</span>
    </div>
    <div class="login-card">
      <h1>С возвращением</h1>
      <p class="sub">Личный кабинет для управления отзывами, вопросами и аналитикой Ozon / Wildberries.</p>
      <form id="login-form" autocomplete="on">
        <div class="rs-field">
          <label for="email">Email</label>
          <input id="email" class="rs" name="email" type="email" autocomplete="username" value="admin@reviewos.ru" required>
        </div>
        <div class="rs-field">
          <label for="password">Пароль</label>
          <input id="password" class="rs" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="submit" type="submit" class="rs-btn lg">Войти →</button>
        <div id="error" class="err"></div>
      </form>
    </div>
    <div class="footer">
      <span>Ozon Seller</span><span>Wildberries</span><span>AI-ответы</span>
    </div>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const errorBox = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      button.disabled = true;
      const orig = button.textContent;
      button.innerHTML = '<span class="rs-spin"></span> Входим…';
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: form.email.value, password: form.password.value }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Не удалось войти");
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));
        window.location.href = "/";
      } catch (error) {
        errorBox.textContent = error.message || "Ошибка входа";
        button.disabled = false;
        button.textContent = orig;
      }
    });
  </script>
</body>
</html>
